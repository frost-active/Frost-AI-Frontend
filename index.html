<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart Scheduler Assistant</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-wrapper {
    width: 95%;
    max-width: 1200px;
    height: 92vh;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    overflow: hidden;
}

.chat-container {
    width: 65%;
    display: flex;
    flex-direction: column;
}

.log-panel {
    width: 35%;
    background: #1a1a1a;
    color: #9f9;
    font-family: monospace;
    font-size: 11px;
    padding: 15px;
    overflow-y: auto;
    border-left: 1px solid #333;
}

.chat-header {
    padding: 18px;
    background: linear-gradient(135deg, #0077ff, #00c6ff);
    color: white;
    font-size: 20px;
    font-weight: 600;
}

.chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f7f9fc;
}

.message {
    max-width: 80%;
    margin-bottom: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    white-space: pre-wrap;
}

.user {
    background: #0077ff;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e9eef5;
}

.chat-input {
    padding: 12px;
    border-top: 1px solid #ddd;
}

.row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

input, select {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    flex: 1;
}

button {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    background: #0077ff;
    color: white;
    cursor: pointer;
}

.example {
    display: inline-block;
    background: #eee;
    padding: 5px 8px;
    margin: 3px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="chat-wrapper">

<div class="chat-container">

<div class="chat-header">🧠 Smart Scheduler</div>

<div class="chat-messages" id="chatMessages"></div>

<div class="chat-input">

<div class="row">
<select id="mode" onchange="toggleMode()">
<option value="interval">Interval</option>
<option value="absolute">Absolute</option>
</select>

<select id="taskType">
<option value="hydration">Hydration</option>
<option value="eye">Eye</option>
<option value="stretch">Stretch</option>
<option value="walk">Walk</option>
</select>
</div>

<div id="intervalBox" class="row">
<input id="intervalInput" placeholder="Enter minutes">
</div>

<div id="absoluteBox" class="row" style="display:none;">
<input id="timeInput" placeholder="HH:MM">
<button onclick="addTime()">+</button>
</div>

<div id="timeList"></div>

<div class="row">
<button onclick="sendStructured()">Send Structured</button>
<button onclick="sendText()">Send Text</button>
</div>

<div class="row">
<input id="textInput" placeholder="Type natural language...">
</div>

<div>
<div class="example" onclick="setExample('drink water every 30 minutes')">Hydration Interval</div>
<div class="example" onclick="setExample('drink water at 9am, 1pm')">Hydration Absolute</div>
<div class="example" onclick="setExample('eye break every 20 minutes')">Eye Interval</div>
<div class="example" onclick="setExample('stretch at 10am, 4pm')">Stretch Absolute</div>
<div class="example" onclick="setExample('walk every 2 hours')">Walk Interval</div>
<div class="example" onclick="setExample('take medicine at 8am daily')">Medication</div>
</div>

</div>
</div>

<div class="log-panel">
<div>Logs</div>
<div id="logPanel"></div>
</div>

</div>

<script>

const API_URL = "https://frost-ai-eehc.onrender.com/parse";
let times = [];
let lastConfig = null; // ✅ added

function toggleMode() {
    const mode = document.getElementById("mode").value;
    document.getElementById("intervalBox").style.display = mode === "interval" ? "flex" : "none";
    document.getElementById("absoluteBox").style.display = mode === "absolute" ? "flex" : "none";
}

function addTime() {
    const val = document.getElementById("timeInput").value;
    if (!val) return;
    times.push(val);
    document.getElementById("timeInput").value = "";
    document.getElementById("timeList").innerHTML =
        times.map(t => `<div>${t}</div>`).join("");
}

function addMessage(content, cls) {
    const div = document.createElement("div");
    div.className = "message " + cls;
    div.innerHTML = content;
    document.getElementById("chatMessages").appendChild(div);
}

function renderLogs(logs) {
    document.getElementById("logPanel").innerHTML =
        logs.map((l,i)=>`[${i+1}] ${l}`).join("<br>");
}

function formatConfig(data) {

    function renderTask(name, obj, key) {
        if (!obj.enabled) return "";

        if (obj.mode === "absolute" && obj.abs?.times?.length) {
            const times = obj.abs.times.map(t =>
                `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`
            ).join(", ");
            return `<div><b>${name}</b>: At ${times}</div>`;
        }

        const val = key === "interval_ms"
            ? Math.round(obj[key]/60000)
            : obj[key];

        return `<div><b>${name}</b>: Every ${val} min</div>`;
    }

    return `
    ${renderTask("💧 Hydration", data.hydration, "interval_ms")}
    ${renderTask("👁 Eye", data.eye, "interval_ms")}
    ${renderTask("🏃 Stretch", data.stretch, "interval_ms")}
    ${renderTask("🚶 Walk", data.walk, "interval_min")}
    `;
}

async function sendStructured() {
    const mode = document.getElementById("mode").value;
    const type = document.getElementById("taskType").value;

    let text = "";

    if (mode === "interval") {
        const val = document.getElementById("intervalInput").value;
        text = `${type} every ${val} minutes`;
    } else {
        text = `${type} at ${times.join(", ")}`;
    }

    send(text);
}

async function sendText() {
    const text = document.getElementById("textInput").value;
    send(text);
}

// ✅ UPDATED SEND FUNCTION (AUTO DOWNLOAD)
async function send(text) {

    addMessage(text, "user");

    const res = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ text })
    });

    const result = await res.json();

    lastConfig = result.data; // store latest

    addMessage(formatConfig(result.data), "bot");
    renderLogs(result.logs || []);

    // 🔥 AUTO DOWNLOAD
    if (lastConfig) {
        const blob = new Blob(
            [JSON.stringify(lastConfig, null, 2)],
            { type: "application/json" }
        );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        const now = new Date();
        a.download = `schedule_${now.getHours()}-${now.getMinutes()}-${now.getSeconds()}.json`;

        a.href = url;
        a.click();

        URL.revokeObjectURL(url);
    }
}

function setExample(t) {
    document.getElementById("textInput").value = t;
}

</script>

</body>
</html>
