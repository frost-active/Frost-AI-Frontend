<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frost Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-wrapper {
    width: 95%;
    max-width: 1100px;
    height: 92vh;
    display: flex;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

.chat-container {
    width: 65%;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.log-panel {
    width: 35%;
    background: #111827;
    color: #9f9;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    overflow-y: auto;
    border-left: 1px solid #333;
}

.chat-header {
    padding: 16px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    font-size: 17px;
}

.chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background: #f1f5f9;
}

.message {
    max-width: 90%;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.user {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e2e8f0;
    color: #0f172a;
}

.invalid-warning {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
}

.section {
    margin-bottom: 10px;
}

.section-title {
    font-weight: 700;
    margin-bottom: 4px;
}

.medication-card {
    background: white;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
}

.medication-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
}

.control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 7px 0;
}

.control-label {
    font-weight: 600;
}

.stepper {
    display: flex;
    align-items: center;
    gap: 5px;
}

.stepper button {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.stepper button:hover {
    background: #1d4ed8;
}

.stepper span {
    min-width: 30px;
    text-align: center;
    font-weight: 600;
}

.number-input {
    width: 75px;
    padding: 6px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

.time-input,
.date-input {
    padding: 6px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

.dose-list {
    margin-top: 8px;
    padding: 8px;
    background: #f8fafc;
    border-radius: 8px;
}

.dose-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 5px 0;
}

.save-btn {
    margin-top: 10px;
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 7px;
    background: #16a34a;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.save-btn:hover {
    background: #15803d;
}

.chat-input {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    background: #eff6ff;
    border-top: 1px solid #bfdbfe;
}

.suggestion-chips {
    display: flex;
    gap: 8px;
    padding: 10px 12px 0 12px;
    background: #eff6ff;
    overflow-x: auto;
    white-space: nowrap;
}

.suggestion-chip {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #93c5fd;
    background: white;
    color: #1d4ed8;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s ease;
}

.suggestion-chip:hover {
    background: #dbeafe;
}

.suggestion-chip:active {
    background: #bfdbfe;
}

.composer {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px 4px 12px;
    background: white;
    border: 1px solid #93c5fd;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
}

.composer:focus-within {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.chat-input input {
    flex: 1;
    min-width: 0;
    padding: 9px 0;
    border: none;
    outline: none;
    background: transparent;
    color: #172554;
    font-size: 14px;
}

.chat-input input::placeholder {
    color: #64748b;
}

#micButton,
#sendButton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    border: none;
    cursor: pointer;
    transition: 0.2s ease;
}

#micButton {
    width: 40px;
    height: 40px;
    margin: 0;
    padding: 0;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    background: #2563eb;
    color: white;

    font-size: 19px;
    line-height: 1;
    cursor: pointer;

    transition: 0.2s ease;
}

#micButton:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

#micButton.listening {
    background: #dc2626;
    color: white;
    animation: micPulse 1s infinite;
}

#sendButton {
    width: 40px;
    height: 40px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    font-size: 20px;
    line-height: 1;
}

#sendButton:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

#micButton:disabled,
#sendButton:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
}

@keyframes micPulse {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.25);
    }

    50% {
        transform: scale(1.08);
        box-shadow: 0 0 0 7px rgba(220, 38, 38, 0.08);
    }
}

.typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
}

.typing-indicator span {
    width: 7px;
    height: 7px;
    background: #64748b;
    border-radius: 50%;
    display: inline-block;
    animation: typingBounce 1.2s infinite ease-in-out;
}

.typing-indicator span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing-indicator span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes typingBounce {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.45;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

@media (max-width: 700px) {
    body {
        align-items: stretch;
    }

    .chat-wrapper {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    .chat-container {
        width: 100%;
    }

    .log-panel {
        display: none;
    }
}
</style>
</head>

<body>

<div class="chat-wrapper">

    <div class="chat-container">

        <div class="chat-header">
            🧠 Frost Assistant
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="suggestion-chips" id="suggestionChips">
            <button type="button" class="suggestion-chip" onclick="useSuggestion(`Add walk at 4pm`)">Add walk at 4pm</button>
            <button type="button" class="suggestion-chip" onclick="useSuggestion(`Hydration every 3 hours`)">Hydration every 3 hours</button>
            <button type="button" class="suggestion-chip" onclick="useSuggestion(`Turn off eye breaks`)">Turn off eye breaks</button>
            <button type="button" class="suggestion-chip" onclick="useSuggestion(`What's at 3pm?`)">What's at 3pm?</button>
        </div>

        <div class="chat-input">

            <div class="composer">

                <input
                    id="textInput"
                    type="text"
                    placeholder="Type your schedule..."
                    autocomplete="off"
                    aria-label="Schedule message"
                >

                <button
                    id="micButton"
                    type="button"
                    onclick="toggleVoiceInput()"
                    title="Voice input"
                    aria-label="Voice input"
                >
                    🎙️
                </button>

            </div>

            <button
                id="sendButton"
                type="button"
                onclick="sendText()"
                title="Send message"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </div>

    <div class="log-panel">
        <div><b>Logs</b></div>
        <br>
        <div id="logPanel"></div>
    </div>

</div>

<script>
const PRODUCTION_API_URL =
    "https://frost-ai-eehc.onrender.com/parse";

const isLocal =
    window.location.protocol === "file:" ||
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1";

const API_URL =
    isLocal
        ? "http://127.0.0.1:5000/parse"
        : PRODUCTION_API_URL;

let lastConfig = null;


/* =========================================================
   MESSAGE FUNCTIONS
========================================================= */

function scrollChatToBottom() {
    const container =
        document.getElementById("chatMessages");

    if (!container) return;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            container.scrollTop =
                container.scrollHeight;
        });
    });
}

function addMessage(content, cls) {
    const div =
        document.createElement("div");

    div.className =
        "message " + cls;

    div.innerHTML =
        content;

    document
        .getElementById("chatMessages")
        .appendChild(div);

    scrollChatToBottom();
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   INVALID INPUT
========================================================= */

function renderInvalid(invalid) {
    if (!invalid || !invalid.length) return;

    const items =
        invalid
            .map(item =>
                `• ${escapeHtml(item.reason)}`
            )
            .join("<br>");

    addMessage(
        `
        <b>⚠️ Invalid input — not scheduled:</b><br>
        ${items}
        `,
        "bot invalid-warning"
    );
}


/* =========================================================
   LOGS
========================================================= */

function renderLogs(logs) {
    document.getElementById("logPanel").innerHTML =
        (logs || [])
            .map((log, index) =>
                `[${index + 1}] ${escapeHtml(log)}`
            )
            .join("<br>");
}


/* =========================================================
   WELCOME MESSAGE
========================================================= */

function showWelcome() {
    addMessage(
        `
        <b>Hi, I am your Frost Active Assistant.</b>
        <br><br>

        How would you like to schedule your device?
        <br><br>

        Try:
        <br>
        • "work from 9am to 6pm, drink water every 30 minutes"
        <br>
        • "meditate from 1pm to 1:15pm"
        <br>
        • "pomodoro 25/5 for 4 cycles from 9am to 12pm"
        <br>
        • "take medicine at 8am daily"
        <br>
        • "take medicine at 8am mon and wed 2 doses per day"
        <br>
        • "take medicine at 8am mon and wed 2 doses per day 30 mins reminder period"
        `,
        "bot"
    );
}


/* =========================================================
   TIME HELPERS
========================================================= */

function pad2(number) {
    return String(number).padStart(2, "0");
}

function hm(hour, minute) {
    return `${pad2(hour)}:${pad2(minute)}`;
}

function formatDisplayTime(hour, minute) {
    hour = Number(hour);
    minute = Number(minute);

    const suffix =
        hour >= 12
            ? "PM"
            : "AM";

    const displayHour =
        hour % 12 || 12;

    return `${displayHour}:${pad2(minute)} ${suffix}`;
}

function formatTimeStr(time) {
    if (!time) return time;

    const parts =
        time.split(":").map(Number);

    return formatDisplayTime(
        parts[0],
        parts[1]
    );
}

function timeToMinutes(time) {
    const parts =
        time.split(":").map(Number);

    return parts[0] * 60 + parts[1];
}

function minutesToDose(minutes) {
    minutes =
        ((minutes % 1440) + 1440) % 1440;

    const hour =
        Math.floor(minutes / 60);

    const minute =
        minutes % 60;

    return {
        h: hour,
        m: minute
    };
}

function msToMinutes(milliseconds) {
    return Math.round(
        milliseconds / 60000
    );
}

function formatIntervalOrAbs(config) {
    if (config.mode === "absolute") {
        const times =
            config.abs &&
            Array.isArray(config.abs.times)
                ? config.abs.times
                : [];

        if (times.length) {
            return `
                At ${times
                    .map(time =>
                        formatDisplayTime(
                            time.h,
                            time.m
                        )
                    )
                    .join(", ")}
            `;
        }

        return "At scheduled time";
    }

    if (
        config.mode === "interval" &&
        config.interval_ms != null
    ) {
        return `
            Every ${msToMinutes(config.interval_ms)}
            minutes
            (${formatDisplayTime(
                config.start_hour,
                config.start_min
            )}
            →
            ${formatDisplayTime(
                config.end_hour,
                config.end_min
            )})
        `;
    }

    return "";
}


/* =========================================================
   DAYS
========================================================= */

function formatDays(days) {
    if (!days || days.length === 0) {
        return "Every day";
    }

    if (days.length === 7) {
        return "Every day";
    }

    return days
        .map(day =>
            day.charAt(0).toUpperCase() +
            day.slice(1)
        )
        .join(", ");
}


/* =========================================================
   MEDICATION UI
========================================================= */

function renderMedication(medication, index) {
    const doses =
        medication.doses || [];

    const firstDose =
        doses.length
            ? hm(doses[0].h, doses[0].m)
            : "08:00";

    return `
        <div class="medication-card">

            <div class="medication-title">
                💊 ${escapeHtml(medication.label)}
            </div>

            <div class="control-row">
                <span class="control-label">
                    Doses per day
                </span>

                <div class="stepper">

                    <button
                        type="button"
                        onclick="changeDoseCount(${index}, -1)"
                    >
                        −
                    </button>

                    <span id="doseCount-${index}">
                        ${doses.length}
                    </span>

                    <button
                        type="button"
                        onclick="changeDoseCount(${index}, 1)"
                    >
                        +
                    </button>

                </div>
            </div>

            <div class="control-row">
                <span class="control-label">
                    Minutes between doses
                </span>

                <input
                    class="number-input"
                    id="gap-${index}"
                    type="number"
                    min="1"
                    max="1440"
                    value="${medication.gap_min || 0}"
                    onchange="changeGap(${index})"
                >
            </div>

            <div class="control-row">
                <span class="control-label">
                    Snooze time
                </span>

                <input
                    class="number-input"
                    id="snooze-${index}"
                    type="number"
                    min="0"
                    max="1440"
                    value="${medication.snooze_min ?? 15}"
                    onchange="changeSnooze(${index})"
                >

                <span>min</span>
            </div>

            <div class="control-row">
                <span class="control-label">
                    First dose
                </span>

                <input
                    class="time-input"
                    id="firstDose-${index}"
                    type="time"
                    value="${firstDose}"
                    onchange="changeFirstDose(${index})"
                >
            </div>

            <div class="control-row">
                <span class="control-label">
                    Start date
                </span>

                <input
                    class="date-input"
                    id="startDate-${index}"
                    type="date"
                    value="${medication.start || ""}"
                    onchange="changeStartDate(${index})"
                >
            </div>

            <div class="control-row">
                <span class="control-label">
                    End date
                </span>

                <input
                    class="date-input"
                    id="endDate-${index}"
                    type="date"
                    value="${medication.end || ""}"
                    onchange="changeEndDate(${index})"
                >
            </div>

            <div class="dose-list">
                <b>Dose times</b>

                <div id="doseList-${index}">
                    ${renderDoseTimes(medication, index)}
                </div>
            </div>

            <div style="margin-top: 8px;">
                <b>Days:</b>
                ${formatDays(medication.days)}
            </div>

            <button
                class="save-btn"
                type="button"
                onclick="saveMedication(${index})"
            >
                Save Medication
            </button>

        </div>
    `;
}

function renderDoseTimes(medication, index) {
    const doses =
        medication.doses || [];

    return doses
        .map((dose, doseIndex) => `
            <div class="dose-row">

                <span>
                    Dose ${doseIndex + 1}
                </span>

                <input
                    type="time"
                    class="time-input"
                    value="${hm(dose.h, dose.m)}"
                    onchange="changeIndividualDose(
                        ${index},
                        ${doseIndex},
                        this.value
                    )"
                >

            </div>
        `)
        .join("");
}


/* =========================================================
   MEDICATION EDITING
========================================================= */

function getMedication(index) {
    return lastConfig &&
        lastConfig.data &&
        lastConfig.data.reminders &&
        lastConfig.data.reminders.medication &&
        lastConfig.data.reminders.medication.medicines
        ? lastConfig.data.reminders.medication.medicines[index]
        : null;
}

function changeDoseCount(index, amount) {
    const medication =
        getMedication(index);

    if (!medication) return;

    let count =
        (medication.doses || []).length +
        amount;

    count =
        Math.max(1, Math.min(12, count));

    const currentDoses =
        medication.doses || [];

    const first =
        currentDoses.length
            ? currentDoses[0]
            : { h: 8, m: 0 };

    let gap =
        Number(medication.gap_min || 30);

    if (gap < 1) gap = 30;

    const firstMinutes =
        first.h * 60 + first.m;

    medication.doses =
        Array.from(
            { length: count },
            (_, doseIndex) =>
                minutesToDose(
                    firstMinutes +
                    doseIndex * gap
                )
        );

    medication.dose_count =
        count;

    medication.gap_min =
        gap;

    refreshMedicationUI();
}

function changeGap(index) {
    const medication =
        getMedication(index);

    if (!medication) return;

    let gap =
        Number(
            document.getElementById(
                `gap-${index}`
            ).value
        );

    gap =
        Math.max(1, Math.min(1440, gap));

    medication.gap_min =
        gap;

    const first =
        medication.doses &&
        medication.doses.length
            ? medication.doses[0]
            : { h: 8, m: 0 };

    const firstMinutes =
        first.h * 60 + first.m;

    medication.doses =
        (medication.doses || []).map(
            (_, doseIndex) =>
                minutesToDose(
                    firstMinutes +
                    doseIndex * gap
                )
        );

    refreshMedicationUI();
}

function changeSnooze(index) {
    const medication =
        getMedication(index);

    if (!medication) return;

    let snooze =
        Number(
            document.getElementById(
                `snooze-${index}`
            ).value
        );

    snooze =
        Math.max(0, Math.min(1440, snooze));

    medication.snooze_min =
        snooze;

    lastConfig.data.reminders.medication.snooze_min =
        snooze;
}

function changeFirstDose(index) {
    const medication =
        getMedication(index);

    if (!medication) return;

    const value =
        document.getElementById(
            `firstDose-${index}`
        ).value;

    if (!value) return;

    const firstMinutes =
        timeToMinutes(value);

    let gap =
        Number(medication.gap_min || 30);

    if (gap < 1) gap = 30;

    medication.doses =
        (medication.doses || []).map(
            (_, doseIndex) =>
                minutesToDose(
                    firstMinutes +
                    doseIndex * gap
                )
        );

    refreshMedicationUI();
}

function changeIndividualDose(
    medicationIndex,
    doseIndex,
    value
) {
    const medication =
        getMedication(medicationIndex);

    if (!medication || !value) return;

    const parts =
        value.split(":").map(Number);

    medication.doses[doseIndex] = {
        h: parts[0],
        m: parts[1]
    };

    refreshMedicationUI();
}

function changeStartDate(index) {
    const medication =
        getMedication(index);

    if (!medication) return;

    const start =
        document.getElementById(
            `startDate-${index}`
        ).value;

    const end =
        medication.end;

    if (start && end && start > end) {
        medication.end =
            start;

        document.getElementById(
            `endDate-${index}`
        ).value =
            start;
    }

    medication.start =
        start;
}

function changeEndDate(index) {
    const medication =
        getMedication(index);

    if (!medication) return;

    const end =
        document.getElementById(
            `endDate-${index}`
        ).value;

    const start =
        medication.start;

    if (start && end && end < start) {
        alert(
            "End date cannot be before start date."
        );

        document.getElementById(
            `endDate-${index}`
        ).value =
            start;

        medication.end =
            start;

        return;
    }

    medication.end =
        end;
}

function refreshMedicationUI() {
    if (!lastConfig) return;

    const medicationBlock =
        lastConfig.data
            .reminders
            .medication;

    const container =
        document.getElementById(
            "currentMedicationControls"
        );

    if (!container) return;

    container.innerHTML =
        medicationBlock.medicines
            .map((medication, index) =>
                renderMedication(
                    medication,
                    index
                )
            )
            .join("");
}

function saveMedication(index) {
    const medication =
        getMedication(index);

    if (!medication) {
        addMessage(
            `
            <b>⚠️ Couldn't save.</b><br>
            That medication entry no longer exists.
            Try sending your schedule again.
            `,
            "bot invalid-warning"
        );

        return;
    }

    lastConfig.data
        .reminders
        .medication
        .snooze_min =
        Number(medication.snooze_min || 0);

    const editor =
        document.getElementById(
            "scheduleEditor"
        );

    if (editor) {
        editor.remove();

    const oldMessage =

    if (oldMessage) {
        oldMessage.remove();
    }

    const confirmation =
        document.createElement("div");

    confirmation.className =
        "message bot";

    confirmation.id =
        "medicationSavedMsg";

    confirmation.innerHTML =
        `
        <b>💊 Medication updated</b><br>
        ${escapeHtml(medication.label)}<br>
        Doses: ${medication.doses.length}<br>
        Snooze: ${medication.snooze_min} minutes<br>
        Gap: ${medication.gap_min || 0} minutes
        `;

    document
        .getElementById("chatMessages")
        .appendChild(confirmation);

    scrollChatToBottom();

    downloadJSON();
}

/* =========================================================
   DOWNLOAD JSON
========================================================= */

function downloadJSON() {
    if (!lastConfig) return;

    const blob =
        new Blob(
            [
                JSON.stringify(
                    lastConfig,
                    null,
                    2
                )
            ],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    const now =
        new Date();

    link.download =
        `schedule_${now.getHours()}-${now.getMinutes()}-${now.getSeconds()}.json`;

    link.href =
        url;

    link.click();

    URL.revokeObjectURL(url);
}

/* =========================================================
   "WHAT'S AT <TIME>" LOOKUP
========================================================= */

function parseQueryTime(text) {
    const match =
        text.match(
            /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i
        );

    if (!match) return null;

    let h =
        parseInt(match[1], 10);

    const m =
        match[2] ? parseInt(match[2], 10) : 0;

    const ampm =
        match[3] ? match[3].toLowerCase() : null;

    if (ampm === "pm" && h < 12) h += 12;
    if (ampm === "am" && h === 12) h = 0;

    if (h > 23 || m > 59) return null;

    return { h, m };
}

function isTimeQuery(text) {
    return (
        /\bwhat\b/i.test(text) &&
        /\b(at|on)\b/i.test(text) &&
        /\d{1,2}(:\d{2})?\s*(am|pm)?/i.test(text)
    );
}

function timeInWindow(h, m, sh, sm, eh, em) {
    const target = h * 60 + m;
    const start = sh * 60 + sm;
    const end = eh * 60 + em;

    if (start <= end) {
        return target >= start && target <= end;
    }

    return target >= start || target <= end;
}

function tryAnswerTimeQuery(text) {
    if (!isTimeQuery(text)) return null;

    const time =
        parseQueryTime(text);

    if (!time) return null;

    if (!lastConfig || !lastConfig.data) {
        return "No task assigned at that time.";
    }

    const reminders =
        lastConfig.data.reminders || {};

    const found = [];

    const WINDOW_TASKS = [
        { key: "hydration", label: "💧 Hydration" },
        { key: "eye", label: "👁️ Eye Break" },
        { key: "stretch", label: "🧘 Stretch" },
        { key: "walk", label: "🚶 Walk" }
    ];

    WINDOW_TASKS.forEach(({ key, label }) => {
        const r = reminders[key];

        if (!r || !r.enabled) return;

        if (r.mode === "absolute" && r.abs && r.abs.times) {
            const hit = r.abs.times.some(
                t => t.h === time.h && t.m === time.m
            );

            if (hit) found.push(label);

        } else if (
            timeInWindow(
                time.h, time.m,
                r.start_hour, r.start_min,
                r.end_hour, r.end_min
            )
        ) {
            found.push(`${label} (active window)`);
        }
    });

    const med =
        reminders.meditation;

    if (
        med && med.enabled &&
        timeInWindow(
            time.h, time.m,
            med.sh, med.sm,
            med.eh, med.em
        )
    ) {
        found.push("🧘 Meditation");
    }

    const medication =
        reminders.medication;

    if (
        medication &&
        medication.enabled &&
        medication.medicines
    ) {
        medication.medicines.forEach(m => {
            const hit = (m.doses || []).some(
                d => d.h === time.h && d.m === time.m
            );

            if (hit) found.push(`💊 ${m.label}`);
        });
    }

    const custom =
        reminders.custom;

    if (
        custom &&
        custom.enabled &&
        custom.events
    ) {
        custom.events.forEach(ev => {
            const hit = (ev.times || []).some(t => {
                const [th, tm] = t.split(":").map(Number);
                return th === time.h && tm === time.m;
            });

            if (hit) found.push(`🔔 ${ev.label}`);
        });
    }

    if (!found.length) {
        return "No task assigned at that time.";
    }

    return (
        `At ${formatDisplayTime(time.h, time.m)} `
        + `you have: ${found.join(", ")}.`
    );
}


/* =========================================================
   SEND TO BACKEND
========================================================= */

async function sendText() {
    if (isListening) {
        stopVoiceInput();
    }

    const input =
        document.getElementById(
            "textInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    addMessage(
        escapeHtml(text),
        "user"
    );

    input.value =
        "";

    const timeAnswer =
        tryAnswerTimeQuery(text);

    if (timeAnswer !== null) {
        addMessage(
            escapeHtml(timeAnswer),
            "bot"
        );

        return;
    }

    setSendingState(true);
    showTyping();

    try {
        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            text: text
                        })
                }
            );

        const result =
            await response.json();

        hideTyping();

        if (
            !response.ok ||
            result.error
        ) {
            addMessage(
                `
                <b>Backend error:</b><br>
                ${escapeHtml(
                    result.error ||
                    "Unknown error"
                )}
                `,
                "bot"
            );

            renderLogs(
                result.logs
            );

            return;
        }

        if (result.reply) {
            addMessage(
                escapeHtml(result.reply),
                "bot"
            );

            renderLogs(
                result.logs
            );

            return;
        }

        lastConfig =
            result;

        try {
            renderCurrentSchedule();
            renderInvalid(result.invalid);
            renderLogs(result.logs);
            downloadJSON();
        } catch (renderError) {
            console.error(renderError);

            addMessage(
                `
                <b>⚠️ Couldn't display the schedule.</b><br>
                ${escapeHtml(
                    renderError.message ||
                    String(renderError)
                )}
                `,
                "bot invalid-warning"
            );

            renderLogs(result.logs);
        }

    } catch (error) {
        hideTyping();

        addMessage(
            `
            <b>Connection error.</b><br>
            Make sure the Flask backend is running
            on port 5000.
            `,
            "bot"
        );

        console.error(error);

    } finally {
        setSendingState(false);
        input.focus();
    }
}


/* =========================================================
   VOICE INPUT
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition =
    null;

let isListening =
    false;

function setupVoiceRecognition() {
    if (!SpeechRecognition) {
        return false;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;

    recognition.maxAlternatives =
        1;

    recognition.onstart = function() {
    isListening = true;

    const mic =
        document.getElementById("micButton");

    const input =
        document.getElementById("textInput");

    mic.classList.add("listening");

    mic.textContent = "🎙️";

    mic.title =
        "Listening... Click to stop";

    mic.setAttribute(
        "aria-label",
        "Stop listening"
    );

    input.placeholder =
        "🎙️ Listening...";
};

    recognition.onresult =
        function(event) {
            let transcript =
                "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {
                transcript +=
                    event.results[i][0]
                        .transcript;
            }

            document.getElementById(
                "textInput"
            ).value =
                transcript.trim();
        };

    recognition.onerror =
        function(event) {
            console.error(
                "Speech recognition error:",
                event.error
            );

            let message =
                "Voice input could not be started.";

            if (
                event.error ===
                "not-allowed"
            ) {
                message =
                    "Microphone permission was denied. Please allow microphone access.";
            } else if (
                event.error ===
                "no-speech"
            ) {
                message =
                    "I didn't hear anything. Please try again.";
            }

            addMessage(
                `
                <b>🎙️ ${
                    escapeHtml(message)
                }</b>
                `,
                "bot"
            );
        };

    recognition.onend =
        function() {
            resetVoiceButton();
        };

    return true;
}

function toggleVoiceInput() {
    if (isListening) {
        stopVoiceInput();
        return;
    }

    if (!SpeechRecognition) {
        addMessage(
            `
            <b>🎙️ Voice input is not supported by this browser.</b><br>
            Try Google Chrome or Microsoft Edge.
            `,
            "bot"
        );

        return;
    }

    if (!recognition) {
        setupVoiceRecognition();
    }

    try {
        recognition.start();
    } catch (error) {
        if (
            error.name !==
            "InvalidStateError"
        ) {
            console.error(error);
        }
    }
}

function resetVoiceButton() {
    isListening =
        false;

    const mic =
        document.getElementById(
            "micButton"
        );

    const input =
        document.getElementById(
            "textInput"
        );

    if (mic) {
        mic.classList.remove(
            "listening"
        );

        mic.textContent =
            "🎙️";

        mic.title =
            "Voice input";

        mic.setAttribute(
            "aria-label",
            "Voice input"
        );
    }

    if (input) {
        input.placeholder =
            "Type your schedule...";
    }
}

function stopVoiceInput() {
    if (recognition) {
        try {
            recognition.stop();
        } catch (error) {
            console.error(error);
        }
    }

    resetVoiceButton();
}
