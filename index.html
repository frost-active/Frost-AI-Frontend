<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Frost Assistant</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-wrapper {
    width: 95%;
    max-width: 1000px;
    height: 90vh;
    display: flex;
    background: white;
    border-radius: 14px;
    overflow: hidden;
}

.chat-container {
    width: 65%;
    display: flex;
    flex-direction: column;
}

.log-panel {
    width: 35%;
    background: #111;
    color: #9f9;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    overflow-y: auto;
    border-left: 1px solid #333;
}

.chat-header {
    padding: 16px;
    background: #2563eb;
    color: white;
    font-weight: 600;
}

.chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background: #f1f5f9;
}

.message {
    max-width: 80%;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    white-space: pre-wrap;
}

.user {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e2e8f0;
}

.chat-input {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}

.chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.chat-input button {
    margin-left: 8px;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

/* ✅ FIXED SPACING */
.section {
    margin-bottom: 6px;
}

.section-title {
    font-weight: 600;
    margin-bottom: 2px;
}
</style>
</head>

<body>

<div class="chat-wrapper">

<div class="chat-container">

<div class="chat-header">🧠 Frost Assistant</div>

<div class="chat-messages" id="chatMessages"></div>

<div class="chat-input">
<input id="textInput" placeholder="Type your schedule..." />
<button onclick="sendText()">Send</button>
</div>

</div>

<div class="log-panel">
<div><b>Logs</b></div>
<div id="logPanel"></div>
</div>

</div>

<script>

const API_URL = "https://frost-ai-eehc.onrender.com/parse";
let lastConfig = null;

// =========================
// MESSAGE HELPERS
// =========================
function addMessage(content, cls) {
    const div = document.createElement("div");
    div.className = "message " + cls;
    div.innerHTML = content;

    document.getElementById("chatMessages").appendChild(div);

    const container = document.getElementById("chatMessages");
    container.scrollTop = container.scrollHeight;
}

function renderLogs(logs) {
    document.getElementById("logPanel").innerHTML =
        (logs || []).map((l,i)=>`[${i+1}] ${l}`).join("<br>");
}

// =========================
// WELCOME
// =========================
function showWelcome() {
    addMessage(`
        <b>Hi, I am your Frost Active Assistant.</b><br><br>

        How would you like to schedule your device?<br><br>

        You can also define your active working hours.<br><br>

        Try:<br>
        • "work from 9am to 6pm, drink water every 30 minutes"<br>
        • "meditate from 1pm to 1:15pm"<br>
        • "pomodoro 25/5 for 4 cycles from 9am to 12pm"<br>
        • "take medicine at 8am daily"
    `, "bot");
}

// =========================
// TIME FORMATTERS
// =========================
function formatTimeObj(t) {
    return `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`;
}

// =========================
// CONFIG RENDERER
// =========================
function formatConfig(data, activeWindow) {

    let html = "";

    // =========================
    // ACTIVE HOURS
    // =========================
    if (activeWindow && activeWindow.start && activeWindow.end) {
        html += `
            <div class="section">
                <div class="section-title">⏰ Active Hours</div>
                <div>${activeWindow.start} → ${activeWindow.end}</div>
            </div>
        `;
    }

    // =========================
    // STANDARD TASKS
    // =========================
    function renderTask(name, obj, key) {

        if (!obj || !obj.enabled) return "";

        if (obj.mode === "absolute" && obj.abs?.times?.length) {

            const times = obj.abs.times
                .map(formatTimeObj)
                .join(", ");

            return `
                <div class="section">
                    <div><b>${name}</b>: ${times}</div>
                </div>
            `;
        }

        const val = key === "interval_ms"
            ? Math.round(obj[key] / 60000)
            : obj[key];

        return `
            <div class="section">
                <div><b>${name}</b>: Every ${val} min</div>
            </div>
        `;
    }

    html += `
        ${renderTask("💧 Hydration", data.hydration, "interval_ms")}
        ${renderTask("👁 Eye", data.eye, "interval_ms")}
        ${renderTask("🏃 Stretch", data.stretch, "interval_ms")}
        ${renderTask("🚶 Walk", data.walk, "interval_min")}
    `;

    // =========================
    // MEDITATION
    // =========================
    if (data.meditation && data.meditation.enabled) {

        const sh = String(data.meditation.sh).padStart(2,'0');
        const sm = String(data.meditation.sm).padStart(2,'0');
        const eh = String(data.meditation.eh).padStart(2,'0');
        const em = String(data.meditation.em).padStart(2,'0');

        html += `
            <div class="section">
                <div class="section-title">🧘 Meditation</div>
                <div>${sh}:${sm} → ${eh}:${em}</div>
            </div>
        `;
    }

    // =========================
    // POMODORO
    // =========================
    if (data.pomo && data.pomo.enabled) {

        let lapText = "";

        if (data.pomo.laps && data.pomo.laps.length > 0) {

            const lap = data.pomo.laps[0];

            const sh = String(lap.sh).padStart(2,'0');
            const sm = String(lap.sm).padStart(2,'0');
            const eh = String(lap.eh).padStart(2,'0');
            const em = String(lap.em).padStart(2,'0');

            lapText = ` (${sh}:${sm} → ${eh}:${em})`;
        }

        html += `
            <div class="section">
                <div class="section-title">🍅 Pomodoro</div>
                <div>
                    ${data.pomo.focus_min}/${data.pomo.break_min} min × ${data.pomo.cycles} cycles${lapText}
                </div>
            </div>
        `;
    }

    // =========================
    // MEDICATION
    // =========================
    if (data.medication && data.medication.length > 0) {

        html += `
            <div class="section">
                <div class="section-title">💊 Medication</div>
        `;

        data.medication.forEach(m => {

            const times = m.doses
                .map(d =>
                    `${String(d.h).padStart(2,'0')}:${String(d.m).padStart(2,'0')}`
                )
                .join(", ");

            html += `
                <div style="margin-bottom:6px;">
                    <b>${m.label}</b><br>
                    ⏰ ${times}<br>
                    📅 ${m.start} → ${m.end}
                </div>
            `;
        });

        html += `</div>`;
    }

    return html;
}

// =========================
// SEND MESSAGE
// =========================
async function sendText() {

    const input = document.getElementById("textInput");
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    try {

        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text })
        });

        const result = await res.json();

        lastConfig = result.data;

        addMessage(
            formatConfig(result.data, result.active_window),
            "bot"
        );

        renderLogs(result.logs);

        // =========================
        // AUTO DOWNLOAD JSON
        // =========================
        if (lastConfig) {

            const blob = new Blob(
                [JSON.stringify(lastConfig, null, 2)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");

            const now = new Date();

            a.download =
                `schedule_${now.getHours()}-${now.getMinutes()}-${now.getSeconds()}.json`;

            a.href = url;

            a.click();

            URL.revokeObjectURL(url);
        }

    } catch (err) {

        addMessage(
            "Something went wrong while contacting the backend.",
            "bot"
        );

        console.error(err);
    }
}

// =========================
// INIT
// =========================
showWelcome();

</script>

</body>
</html>
